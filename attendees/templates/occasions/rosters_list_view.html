{% extends "base.html" %}
{% load static i18n %}

{% block title %}
  Rosters (Multi-Date)
{% endblock title %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/rosters_list_view.css' %}">
{% endblock extra_css %}

{% block extra_head %}
  <!-- DevExtreme 23.2 CSS (external CDN in extra_head to avoid django-compressor) -->
  <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/23.2.4/css/dx.light.compact.css">

  <!-- JSZip (for Excel export) -->
  <script defer
          src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
          integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
  </script>

  <!-- ExcelJS (for DevExtreme Excel export) -->
  <script defer
          src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"
          integrity="sha512-UnrKxsCMN9hFk7M56t4I4ckB4N/2HHi0w/7+B/1JsXIX3DmyBcsGpT3/BsuZMZf+6mAr0vP81syWtfynHJ69JA=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
  </script>

  <!-- FileSaver.js (for saving exported Excel files) -->
  <script defer
          src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"
          integrity="sha512-Qlv6VSKh1gDKGoJbnyA5RMXYcvnpIqhO++MhIM2fStMcGT9i2T//tSwYFlcyoRRDcDZ+TYHpH8azBBCyhpSeqw=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
  </script>

  <!-- Vue 3 Core (Pinned to 3.3.4 for stability) -->
  <script defer src="https://unpkg.com/vue@3.3.4/dist/vue.global.prod.js"></script>

  <!-- DevExtreme 23.2 Core -->
  <script defer
          type="text/javascript"
          src="https://cdn3.devexpress.com/jslib/23.2.4/js/dx.web.js">
  </script>

  <!-- Application Logic -->
  <script defer
          type="text/javascript"
          src="{% static 'js/occasions/rosters_list_view.js' %}">
  </script>
{% endblock extra_head %}

{% block content %}
<div class="rosters-container" id="app"
     data-assemblies-endpoint="{{ assemblies_endpoint }}"
     data-categories-endpoint="{{ categories_endpoint }}"
     data-meets-endpoint-by-slug="{{ meets_endpoint_by_slug }}"
     data-rosters-endpoint="{{ rosters_endpoint }}"
     data-attendingmeets-endpoint="{{ attendingmeets_endpoint }}"
     data-attendings-endpoint="{{ attendings_endpoint }}"
     data-characters-endpoint="{{ characters_endpoint }}"
     data-teams-endpoint="{{ teams_endpoint }}"
     data-user-can-write="{{ user_can_write|yesno:'true,false' }}">
  {% csrf_token %}
  
  <div class="d-flex justify-content-between mb-3">
    <div class="d-flex">
      <h3>Rosters Table</h3>
    </div>
  </div>

  <!-- DevExtreme Filters Form -->
  <div id="rosters-filter-form-container" ref="filterFormRef"></div>

  <!-- DevExtreme DataGrid -->
  <div id="rosters-datagrid-container" ref="dataGridRef" class="mt-3"></div>
</div>
{% endblock content %}
