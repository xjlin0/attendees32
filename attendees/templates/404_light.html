<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 15vh 20px; color: #333; }
      h1 { font-size: 2rem; margin-bottom: 1rem; }
      p { font-size: 1.1rem; color: #666; margin-bottom: 2rem; }
      .back-btn { 
        padding: 10px 24px; font-size: 1rem; color: #fff; background-color: #0d6efd; 
        border: none; border-radius: 4px; cursor: pointer; text-decoration: none; 
      }
      .back-btn:hover { background-color: #0b5ed7; }
    </style>
  </head>
  <body>
    <h1>Page Not Found (404)</h1>
    
    <p>This is not the page you were looking for.</p>
    
    <button type="button" class="back-btn" onclick="history.back();">Go Back</button>
  </body>
</html>
