{% extends "admin/change_list.html" %}
{% load i18n admin_urls %}

{% block object-tools-items %}
    <li>
        <a href="#"
           onclick="openBackupModal()"
           class="viewsitelink">
            Download Database Backup
        </a>
    </li>
    {{ block.super }}

    <!-- Custom Modal (Div-based) to support Password Managers nicely -->
    <div id="backup-modal-overlay" style="visibility: hidden; opacity: 0; pointer-events: none; transition: opacity 0.2s; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center;">
        <div style="background: white; padding: 20px; border-radius: 8px; width: 400px; max-width: 90%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); color: #333;">
            <form method="POST" action="download-sql/" onsubmit="closeBackupModal()">
                {% csrf_token %}
                <h4 style="margin-top: 0; color: #417690;">⚠️ Confirm</h4>
                <p>Please enter your password to download database backup</p>
                
                <!-- Ensure no errors for password manager, we don't use this value  -->
                <div style="height: 0; overflow: hidden; margin: 0; padding: 0; border: none;">
                    <input type="text" name="username" value="{{ request.user.username }}" autocomplete="username" tabindex="-1">
                </div>
                
                <!-- Allow password manager to auto-fill -->
                <div style="position: relative; margin-bottom: 15px;">
                    <input id="backup-pwd-input" type="password" name="pwd" required autocomplete="current-password" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                
                <div style="text-align: right;">
                    <button type="button" onclick="closeBackupModal()" style="padding: 8px 15px; margin-right: 10px; cursor: pointer; border: 1px solid #ccc; background: white; border-radius: 4px; color: #333;">Cancel</button>
                    <button type="submit" style="padding: 8px 15px; background-color: #417690; color: white; border: none; border-radius: 4px; cursor: pointer;">Confirm download</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openBackupModal() {
            const msg = document.querySelector('.messagelist');
            if (msg) msg.style.display = 'none';  // Hide previous errors such as wrong password

            const modal = document.getElementById('backup-modal-overlay');
            modal.style.visibility = 'visible';
            modal.style.opacity = '1';
            modal.style.pointerEvents = 'auto';

            // Delay focus to give password manager some time to fill DOM
            setTimeout(function() {
                document.getElementById('backup-pwd-input').focus();
            }, 300);

            document.addEventListener('keydown', handleEscKey);  // User Esc to close modal
        }

        function closeBackupModal() {
            var modal = document.getElementById('backup-modal-overlay');
            modal.style.visibility = 'hidden';
            modal.style.opacity = '0';
            modal.style.pointerEvents = 'none';
            document.removeEventListener('keydown', handleEscKey);
        }

        function handleEscKey(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                closeBackupModal();
            }
        }
    </script>
{% endblock %}
