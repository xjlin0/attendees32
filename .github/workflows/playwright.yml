name: Playwright

# The browser end-to-end suite, separate from the pytest job in ci.yml because
# it needs Node, real browsers and a running server rather than the Django test
# client — and because a browser failure should be legible on its own.
#
# One job per engine: Chromium and WebKit fail independently, so a WebKit-only
# layout bug does not read as "the browser tests are broken".

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: [ "master", "main" ]
    paths-ignore: [ "docs/**" ]

  push:
    branches: [ "master", "main" ]
    paths-ignore: [ "docs/**" ]

jobs:
  e2e:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      # One engine failing should not cancel the other: knowing whether a bug
      # is WebKit-only is most of the diagnosis.
      fail-fast: false
      matrix:
        browser: [ chromium, webkit ]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Create the empty mail env files the stack expects
        run: touch .envs/.local/.sendgrid.env .envs/.local/.mailgun.env

      # A browser run signs in dozens of times from one address and gets the
      # password wrong once on purpose; the production default of three failed
      # sign-ins per ten minutes would lock the rest of the run out.
      - name: Relax the failed-login rate limit for this run
        run: echo "DJANGO_LOGIN_FAILED_RATE_LIMIT=1000/m" >> .envs/.local/.django

      - name: Build the Stack
        run: docker compose -f local.yml build django

      - name: Run DB Migrations
        run: docker compose -f local.yml run --rm django python manage.py migrate

      - name: Load the golden congregation
        run: |
          docker compose -f local.yml run --rm django python manage.py \
            load_golden_data --seed --force --manifest e2e/golden-manifest.json

      - name: Start the application
        run: |
          docker compose -f local.yml up -d django
          timeout 120 bash -c \
            'until curl -sf -o /dev/null http://localhost:8008/accounts/login/; do sleep 2; done'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Show the application log on failure
        if: failure()
        run: docker compose -f local.yml logs --tail 200 django

      - name: Tear down the Stack
        if: always()
        run: docker compose -f local.yml down --remove-orphans
